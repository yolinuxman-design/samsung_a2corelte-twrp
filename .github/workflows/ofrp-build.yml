name: 🦊 OrangeFox 9.0 Build (a2corelte)

on:
  workflow_dispatch:

env:
  MANIFEST_BRANCH: fox_9.0
  DEVICE_TREE: https://github.com/yolinuxman-design/samsung_a2corelte-twrp.git
  DEVICE_TREE_BRANCH: fox_9.0
  DEVICE_PATH: device/samsung/a2corelte
  DEVICE_NAME: a2corelte

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04   # MUST be 22.04: fox_9.0 needs Python 2.7 (gone in 24.04)
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 6144
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Setup build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python2 bc cpio rsync lz4
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version   # must print Python 2.7.x
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync OrangeFox sources (fox_9.0 manifest)
        run: |
          mkdir -p ~/fox
          cd ~/fox
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b $MANIFEST_BRANCH
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        run: git clone $DEVICE_TREE -b $DEVICE_TREE_BRANCH $DEVICE_PATH

      - name: Build OrangeFox
        run: |
          cd ~/fox
          export FOX_BUILD_DEVICE=$DEVICE_NAME
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          export FOX_VANILLA_BUILD=1
          source build/envsetup.sh
          lunch omni_$DEVICE_NAME-eng
          mka recoveryimage

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-9.0-a2corelte
          path: |
            /home/runner/fox/out/target/product/a2corelte/OrangeFox*.img
            /home/runner/fox/out/target/product/a2corelte/recovery.*
